name: Build Sliman Identity APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Prepare Gradle 8.11.1 & Wrapper
        run: |
          GRADLE_VER="8.11.1"
          curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-${GRADLE_VER}/bin/gradle wrapper --gradle-version "${GRADLE_VER}" --distribution-type bin
          chmod +x gradlew

        - name: Download Xposed API 82 JAR
        run: |
          mkdir -p app/libs
          curl -sSL -f "https://github.com/MALTF/XposedBridgeAPI/releases/download/v82/api-82.jar" -o app/libs/api-82.jar || \
          curl -sSL -f "https://artifactory.appodeal.com/appodeal-public/de/robv/android/xposed/api/82/api-82.jar" -o app/libs/api-82.jar
          ls -lh app/libs/api-82.jar


      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sliman-IdentitySwitcher-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sliman-IdentitySwitcher-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
